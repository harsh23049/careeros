<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CareerOS</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>CareerOS</h1>

        <div id="status">
            Reading job...
        </div>

        <div id="job">
            <p>
                <strong>Title:</strong>
                <span id="jobTitle">-</span>
            </p>

            <p>
                <strong>Company:</strong>
                <span id="company">-</span>
            </p>

            <p>
                <strong>Location:</strong>
                <span id="location">-</span>
            </p>

            <p>
                <strong>Description:</strong>
                <span id="description">-</span>
            </p>

            <p>
                <strong>URL:</strong>
                <span id="jobUrl">-</span>
            </p>
        </div>

        <div class="actions">
            <button id="saveJob" disabled>
                Save Job
            </button>

            <button id="analyzeJob" disabled>
                Analyze Job
            </button>
        </div>

        <div id="analysis" class="analysis"></div>

    </div>

    <script type="module" src="popup.js"></script>

</body>
</html>
