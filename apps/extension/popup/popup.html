<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CareerOS</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>CareerOS</h1>

        <div id="status">
            Reading job...
        </div>

        <div id="job">
            <p>
                <strong>Title:</strong>
                <span id="jobTitle">-</span>
            </p>

            <p>
                <strong>Company:</strong>
                <span id="company">-</span>
            </p>

            <p>
                <strong>Location:</strong>
                <span id="location">-</span>
            </p>

            <p>
                <strong>Description:</strong>
                <span id="description">-</span>
            </p>

            <p>
                <strong>URL:</strong>
                <span id="jobUrl">-</span>
            </p>
        </div>

        <div class="actions">
            <button id="saveJob" disabled>
                Save Job
            </button>

            <button id="analyzeJob" disabled>
                Analyze Job
            </button>
        </div>

        <div id="analysis" class="analysis"></div>

        <div id="resumeSection" class="resume-section" style="display:none">
            <label for="resumeSelect">Select Resume:</label>
            <select id="resumeSelect">
                <option value="">Loading resumes...</option>
            </select>
            <div class="actions">
                <button id="matchResume" disabled>Match Resume</button>
                <button id="generateCoverLetter" disabled>Generate Cover Letter</button>
            </div>
        </div>

        <div id="matchResult" class="match-result" style="display:none"></div>
        <div id="coverLetterResult" class="cover-letter-result" style="display:none"></div>

    </div>

    <script type="module" src="popup.js"></script>

</body>
</html>
